<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hira — bride-to-be persona">
  <!-- Background — blue-grey from existing card -->
  <rect width="64" height="64" rx="32" fill="#1f2535"/>
  <!-- Lavender hand silhouette with bridal pose (fingers slightly fanned) -->
  <g transform="translate(0,2)">
    <!-- Wrist -->
    <rect x="22" y="46" width="20" height="9" rx="2" fill="#3a3f4f"/>
    <!-- Palm -->
    <path d="M22 35 Q22 28 32 27 Q42 28 42 35 L42 48 Q42 51 39 51 L25 51 Q22 51 22 48 Z" fill="#bfa4ce"/>
    <!-- Fingers — taller, more graceful pose -->
    <rect x="23.5" y="15" width="3.6" height="17" rx="1.8" fill="#bfa4ce"/>
    <rect x="28.5" y="11" width="3.6" height="21" rx="1.8" fill="#bfa4ce"/>
    <rect x="33.5" y="13" width="3.6" height="19" rx="1.8" fill="#bfa4ce"/>
    <rect x="38.2" y="19" width="3.5" height="13" rx="1.8" fill="#bfa4ce"/>
    <!-- Thumb -->
    <ellipse cx="20" cy="40" rx="3.2" ry="6" fill="#bfa4ce" transform="rotate(-30 20 40)"/>
    <!-- Nail tips in deep burgundy (bridal tier) -->
    <rect x="23.5" y="15" width="3.6" height="3.8" rx="1.5" fill="#7a1f2a"/>
    <rect x="28.5" y="11" width="3.6" height="3.8" rx="1.5" fill="#7a1f2a"/>
    <rect x="33.5" y="13" width="3.6" height="3.8" rx="1.5" fill="#7a1f2a"/>
    <rect x="38.2" y="19" width="3.5" height="3.5" rx="1.5" fill="#7a1f2a"/>
  </g>
  <!-- Wedding ring on ring finger — gold accent -->
  <circle cx="35.3" cy="20" r="2.6" fill="none" stroke="#d4a948" stroke-width="1.6"/>
  <circle cx="35.3" cy="18" r="1.1" fill="#f1ce6e"/>
  <!-- Henna swirl accent at top-right corner -->
  <path d="M48 14 Q52 12 54 16 Q56 20 52 22 Q50 23 50 20" stroke="#d4a948" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="52" cy="14" r="1" fill="#d4a948" opacity="0.8"/>
</svg>
