<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ayesha — values-driven (wudu-friendly) persona">
  <!-- Background — green-tinted to match card -->
  <rect width="64" height="64" rx="32" fill="#1f2e25"/>

  <!-- Hijab back drape (behind body) — soft sage -->
  <path d="M10 64 Q10 38 32 32 Q54 38 54 64 Z" fill="#5a7665"/>

  <!-- Shoulders / front bust (modest abaya in lavender) -->
  <path d="M14 64 Q14 44 32 42 Q50 44 50 64 Z" fill="#bfa4ce"/>

  <!-- Face — warm-tan skin tone -->
  <ellipse cx="32" cy="28" rx="8.8" ry="9.8" fill="#f0d8c0"/>

  <!-- Neck (mostly covered by hijab) -->
  <rect x="29.5" y="35" width="5" height="4" fill="#e8d2bf"/>

  <!-- Hijab front layer — covers hair fully, frames the face -->
  <path d="M21 28 Q21 13 32 12 Q43 13 43 28
           L43 41 Q43 44 39 44 L25 44 Q21 44 21 41 Z" fill="#7da38e"/>
  <!-- Hijab inner shading / fold -->
  <path d="M21 28 Q21 14 32 13 Q43 14 43 28
           L43 32 Q38 30 32 30 Q26 30 21 32 Z" fill="#5a7665" opacity="0.55"/>
  <!-- Face opening — re-stamp the face on top so hijab frames it -->
  <ellipse cx="32" cy="28" rx="7.2" ry="8.6" fill="#f0d8c0"/>

  <!-- Eyebrows — soft -->
  <path d="M27.2 26.5 Q28.5 25.8 30 26.3" stroke="#2a1810" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M34 26.3 Q35.5 25.8 36.8 26.5" stroke="#2a1810" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Eyes — warm, calm expression -->
  <circle cx="28.8" cy="28.8" r="0.9" fill="#2a1810"/>
  <circle cx="35.2" cy="28.8" r="0.9" fill="#2a1810"/>

  <!-- Lips — soft nude -->
  <path d="M30 32.6 Q32 33.6 34 32.6" stroke="#a07a6a" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Small hijab knot / pin at the side -->
  <circle cx="23" cy="36" r="1.4" fill="#5a7665"/>

  <!-- Water droplet accent — wudu trigger -->
  <path d="M50 8 Q54 14 54 17 Q54 21 50 21 Q46 21 46 17 Q46 14 50 8 Z" fill="#7ec8db" opacity="0.95"/>
  <ellipse cx="48.5" cy="16" rx="1.2" ry="2" fill="#cdeff7" opacity="0.7"/>
  <!-- Smaller follow droplet -->
  <path d="M55 26 Q57 29 57 31 Q57 33 55 33 Q53 33 53 31 Q53 29 55 26 Z" fill="#7ec8db" opacity="0.75"/>
</svg>
