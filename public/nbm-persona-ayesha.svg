<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ayesha — values-driven (wudu-friendly) persona">
  <!-- Background — green-tinted from existing card -->
  <rect width="64" height="64" rx="32" fill="#1f2e25"/>
  <!-- Lavender hand silhouette — palm slightly cupped, mid-wudu position -->
  <g transform="translate(0,2)">
    <!-- Wrist -->
    <rect x="22" y="46" width="20" height="9" rx="2" fill="#33473b"/>
    <!-- Palm — slightly cupped (asymmetric for wudu motion) -->
    <path d="M22 36 Q22 29 32 28 Q42 29 42 36 L42 48 Q42 51 39 51 L25 51 Q22 51 22 48 Z" fill="#bfa4ce"/>
    <!-- Fingers -->
    <rect x="23.5" y="17" width="3.6" height="15" rx="1.8" fill="#bfa4ce"/>
    <rect x="28.5" y="13" width="3.6" height="19" rx="1.8" fill="#bfa4ce"/>
    <rect x="33.5" y="15" width="3.6" height="17" rx="1.8" fill="#bfa4ce"/>
    <rect x="38.2" y="20" width="3.5" height="12" rx="1.8" fill="#bfa4ce"/>
    <!-- Thumb -->
    <ellipse cx="20" cy="40" rx="3.2" ry="6" fill="#bfa4ce" transform="rotate(-30 20 40)"/>
    <!-- Subtle nail tips, soft nude (everyday tier) -->
    <rect x="23.5" y="17" width="3.6" height="3.2" rx="1.5" fill="#d9c2a1"/>
    <rect x="28.5" y="13" width="3.6" height="3.2" rx="1.5" fill="#d9c2a1"/>
    <rect x="33.5" y="15" width="3.6" height="3.2" rx="1.5" fill="#d9c2a1"/>
    <rect x="38.2" y="20" width="3.5" height="3" rx="1.5" fill="#d9c2a1"/>
  </g>
  <!-- Water droplet accent — represents wudu trigger -->
  <path d="M50 8 Q54 14 54 17 Q54 21 50 21 Q46 21 46 17 Q46 14 50 8 Z" fill="#7ec8db" opacity="0.92"/>
  <ellipse cx="48.5" cy="16" rx="1.2" ry="2" fill="#cdeff7" opacity="0.7"/>
  <!-- Smaller follow droplet -->
  <path d="M55 25 Q57 28 57 30 Q57 32 55 32 Q53 32 53 30 Q53 28 55 25 Z" fill="#7ec8db" opacity="0.75"/>
</svg>
