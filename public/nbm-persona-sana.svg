<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sana — working professional persona">
  <!-- Background — purple-tinted to match card -->
  <rect width="64" height="64" rx="32" fill="#2a1f35"/>

  <!-- Hair (back layer, falls past shoulders) -->
  <path d="M18 28 Q18 14 32 12 Q46 14 46 28 L46 50 Q46 56 41 56 L23 56 Q18 56 18 50 Z" fill="#3a2a1f"/>

  <!-- Shoulders / blouse — lavender accent (her work attire) -->
  <path d="M12 64 Q12 47 32 44 Q52 47 52 64 Z" fill="#bfa4ce"/>
  <!-- Subtle V-neck collar -->
  <path d="M28 44 L32 50 L36 44 Z" fill="#9b7fb4"/>

  <!-- Neck -->
  <rect x="29.2" y="36" width="5.6" height="6" fill="#e8d2bf"/>

  <!-- Face — warm-tan skin tone -->
  <ellipse cx="32" cy="27" rx="9.2" ry="10.5" fill="#f0d8c0"/>

  <!-- Hair front (side-parted bangs, modern professional cut) -->
  <path d="M23 22 Q24 13 32 12 Q40 13 41 23 Q39 19 33 19 Q28 19 25 22 Z" fill="#3a2a1f"/>
  <!-- Hair side strand -->
  <path d="M22.5 24 Q21 30 22.5 36 Q21 32 22 24 Z" fill="#3a2a1f"/>

  <!-- Eyebrows -->
  <path d="M27 26 Q28.5 25.3 30 26" stroke="#2a1810" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M34 26 Q35.5 25.3 37 26" stroke="#2a1810" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="28.5" cy="28.4" r="0.9" fill="#2a1810"/>
  <circle cx="35.5" cy="28.4" r="0.9" fill="#2a1810"/>

  <!-- Lips — muted plum -->
  <path d="M30 32.4 Q32 33.6 34 32.4" stroke="#9b5a6a" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Clock accent — time-pressured trigger -->
  <circle cx="51" cy="13" r="6" fill="#e8d5f0" opacity="0.95"/>
  <circle cx="51" cy="13" r="4.5" fill="#2a1f35"/>
  <line x1="51" y1="13" x2="51" y2="10.2" stroke="#e8d5f0" stroke-width="1" stroke-linecap="round"/>
  <line x1="51" y1="13" x2="53.4" y2="13" stroke="#e8d5f0" stroke-width="1" stroke-linecap="round"/>
</svg>
